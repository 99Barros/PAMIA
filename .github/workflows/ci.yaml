name: PAMIA SDK - CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Qualidade de Código, Linter e Testes Unitários (Ecossistema Node.js)
  # ---------------------------------------------------------------------------
  quality-and-tests:
    name: 1. Lint & Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Ambiente Node.js (Versão 20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # Aponta diretamente para o lockfile dentro da subpasta do app demonstrativo
          cache-dependency-path: 'pamia/app_demonstrativo/package-lock.json'

      - name: Instalar Dependências (Clean Install)
        run: npm ci
        working-directory: ./pamia/app_demonstrativo

      - name: Executar Análise Estática (Linter)
        run: npm run lint --if-present
        working-directory: ./pamia/app_demonstrativo

      - name: Executar Suíte de Testes Unitários
        run: npm test --if-present
        working-directory: ./pamia/app_demonstrativo

  # ---------------------------------------------------------------------------
  # JOB 2: Validação de Build do SDK Android (Ecossistema Java & Gradle)
  # ---------------------------------------------------------------------------
  build-android-validation:
    name: 2. Validação de Build Gradle
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17 (Padrão Android Moderno)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Conceder Permissão de Execução ao Gradle Wrapper
        run: chmod +x gradlew
        working-directory: ./pamia/app_demonstrativo/android
        continue-on-error: true

      - name: Executar Compilação de Teste do SDK (Assemble Release)
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8"
        working-directory: ./pamia/app_demonstrativo/android

      - name: Armazenar Artefato Binário de Teste (.aar)
        uses: actions/upload-artifact@v4
        with:
          name: pamia-sdk-aar-output
          path: |
            pamia/app_demonstrativo/android/app/build/outputs/aar/*.aar
            pamia/app_demonstrativo/android/build/outputs/apk/release/*.apk
          retention-days: 5