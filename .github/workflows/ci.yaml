name: PAMIA SDK - Pipeline CI/CD (TCC)

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Validação de Qualidade e Testes Unitários
  # -------------------------------------------------------------
  quality-and-tests:
    name: 1. Lint & Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (Ambiente de Dev)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint --if-present

      - name: Executar Testes Unitários
        run: npm test --if-present

  # -------------------------------------------------------------
  # ETAPA 2: Build do SDK Android (.aar / APK de Demonstração)
  # -------------------------------------------------------------
  build-android:
    name: 2. Compilação do SDK Android
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x android/gradlew
        continue-on-error: true

      - name: Compilar Artefato Release
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Armazenar Artefato de Build (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pamia-sdk-binaries
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/build/outputs/aar/*.aar
          retention-days: 7

  # -------------------------------------------------------------
  # ETAPA 3: Publicação de Release (Acionada apenas por Tags)
  # -------------------------------------------------------------
  publish-release:
    name: 3. Publicar Release dos Artefatos
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Download dos Artefatos Compilados
        uses: actions/download-artifact@v4
        with:
          name: pamia-sdk-binaries
          path: build-output

      - name: Criar GitHub Release Automatizada
        uses: softprops/action-gh-release@v1
        with:
          files: build-output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}