name:  SDK - CI/CD (JitPack Ready)

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: Validação de Qualidade e Testes Unitários (Node.js)
  # -------------------------------------------------------------
  quality-and-tests:
    name: 1. Lint & Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (Ambiente de Dev)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '/app_demonstrativo/package-lock.json'

      - name: Instalar Dependências
        run: npm ci
        working-directory: .//app_demonstrativo

      - name: Executar Linter
        run: npm run lint --if-present
        working-directory: .//app_demonstrativo

      - name: Executar Testes Unitários
        run: npm test --if-present
        working-directory: .//app_demonstrativo

  # -------------------------------------------------------------
  # ETAPA 2: Validação de Compilação Android (Garante que o SDK compila)
  # -------------------------------------------------------------
  build-android-validation:
    name: 2. Validação de Build Gradle
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew
        working-directory: .//app_demonstrativo/android
        continue-on-error: true

      - name: Testar Compilação do SDK (Assemble)
        run: |
          ./gradlew assembleRelease --no-daemon
        working-directory: .//app_demonstrativo/android

      - name: Armazenar Artefato de Teste (Upload opcional)
        uses: actions/upload-artifact@v4
        with:
          name: -sdk-build-test
          path: |
            /app_demonstrativo/android/app/build/outputs/aar/*.aar
          retention-days: 3